# gitleaks configuration: the default rules, the portfolio's required GitHub
# token rule, and exactly one narrow exception.

[extend]
useDefault = true

# Required by the gainratio/ci Foundation guard, which canary-tests this file.
# GitHub App installation tokens and Actions GITHUB_TOKEN use a stateless
# ghs_<APPID>_<JWT> format that gitleaks 8.30.1's built-in rule cannot see
# (https://github.com/gitleaks/gitleaks/issues/2192). Same rule as Foundation's default.
[[rules]]
id = "github-app-token-stateless"
description = "GitHub App installation or Actions token (stateless ghs_<APPID>_<JWT> format)"
regex = '''ghs_[A-Za-z0-9._-]{36,}'''
keywords = ["ghs_"]

# extension/manifest.json "key" is the browser extension's RSA *public* key.
# Chrome derives the extension's stable id from it, and it is meant to be
# published. It trips the generic-api-key heuristic, so this exception applies
# only to that one rule, and only to an RSA-2048 SubjectPublicKeyInfo value.
# Every other rule still scans every file, including the manifest.
[[allowlists]]
description = "RSA public keys are not secrets (Chrome extension manifest key)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA[A-Za-z0-9+/=]+$''']
