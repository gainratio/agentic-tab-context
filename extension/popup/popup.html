<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic Tab Context</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="header">
        <span class="dot" id="status-dot"></span>
        <h1>Agentic Tab Context</h1>
      </header>
      <p class="badge" id="status-text" role="status" aria-live="polite">Checking…</p>

      <section class="tab-box">
        <div class="label">This tab</div>
        <div class="tab-title" id="tab-title">—</div>
        <div class="tab-url" id="tab-url">—</div>
      </section>

      <button type="button" class="primary-btn" id="bind-btn" disabled>
        Let my assistant use this tab
      </button>

      <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>

      <footer class="footer">
        Or just ask your assistant to <em>"look at my browser"</em>.
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
